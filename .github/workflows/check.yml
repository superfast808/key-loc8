# Builds the real Docker image for every pull request, so a change that
# would break the build shows a red cross before anyone merges it.
name: Build check

on:
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build app image
        run: docker build -t key-loc8-check public/Key-Locate
